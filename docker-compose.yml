version: "3.9"

services:
  api:
    build: .
    container_name: devops_api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=123456
      - DB_NAME=devopsdb
    depends_on:
      - db
    command: npm run dev
    volumes:
      - .:/app
    restart: always

  db:
    image: postgres:15
    container_name: devops_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=devopsdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  frontend:
    build: ./frontend  
    container_name: devops_frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always

volumes:
  pgdata: